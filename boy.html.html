<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>It's a Boy!</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #eff6ff; display: grid; place-items: center; padding: 10px; }
    img { display: block; max-width: 100%; max-height: calc(100vh - 20px); width: auto; height: auto; object-fit: contain; }
  </style>
</head>
<body>
  <img src="images/boy.png" alt="It's a Boy!">
</body>
</html>
