<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gender Reveal Scratch Off</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px 12px 30px;
      background: #efefef;
      font-family: 'Open Sans', Arial, sans-serif;
    }

    .scratch-container {
      width: min(450px, 100%);
      margin: 0 auto;
      border: 10px solid #fff;
      background: #fff;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Image source is 1080 x 1920. Preserve its aspect ratio on all screens. */
    .scratchpad {
      width: 100%;
      aspect-ratio: 9 / 16;
      height: auto;
      position: relative;
      overflow: hidden;
      background: #fff;
      touch-action: none;
    }

    /* Invisible links, aligned with the six circles on images/back.png. */
    .star-link {
      position: absolute;
      z-index: 3;
      display: block;
      width: 23%;
      aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none; /* Allow scratching until this star is revealed. */
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .star-link.enabled { pointer-events: auto; }
    .star-link:focus-visible { outline: 3px solid #202020; outline-offset: 2px; }

    /* TOP: Girl, Boy, Girl | BOTTOM: Boy, Girl, Boy. */
    .star-1 { left: 24.2%; top: 65.0%; }
    .star-2 { left: 50.2%; top: 65.0%; }
    .star-3 { left: 76.2%; top: 65.0%; }
    .star-4 { left: 24.2%; top: 79.9%; }
    .star-5 { left: 50.2%; top: 79.9%; }
    .star-6 { left: 76.2%; top: 79.9%; }

    .try-again-btn {
      display: block;
      margin: 12px auto 0;
      padding: 10px 20px;
      background: #ff6b6b;
      color: #fff;
      font-weight: bold;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="scratch-container">
    <div id="scratchArea" class="scratchpad">
      <!-- These invisible links do not change the original PNG design. -->
      <a class="star-link star-1" href="girl.html" aria-label="It's a Girl – top left star" tabindex="-1"></a>
      <a class="star-link star-2" href="boy.html" aria-label="It's a Boy – top middle star" tabindex="-1"></a>
      <a class="star-link star-3" href="girl.html" aria-label="It's a Girl – top right star" tabindex="-1"></a>
      <a class="star-link star-4" href="boy.html" aria-label="It's a Boy – bottom left star" tabindex="-1"></a>
      <a class="star-link star-5" href="girl.html" aria-label="It's a Girl – bottom middle star" tabindex="-1"></a>
      <a class="star-link star-6" href="boy.html" aria-label="It's a Boy – bottom right star" tabindex="-1"></a>
    </div>
  </div>
  <button type="button" class="try-again-btn" id="tryAgain">Try Again</button>

  <!-- Keep the original jQuery / scratch-pad workflow from your GitHub page. -->
  <script src="https://code.jquery.com/jquery-latest.min.js"></script>
  <script src="./wScratchPad.min.js"></script>
  <script>
    $(function () {
      var $pad = $('#scratchArea');
      var $stars = $pad.find('.star-link');
      var touchedStars = new Set();

      // How much of an individual star's cover needs scratching before a click works.
      // 0.08 = 8%. Adjust upwards for more scratching, downwards for less.
      var STAR_REVEAL_FRACTION = 0.08;

      function markTouched(event) {
        var x = event.pageX;
        var y = event.pageY;
        var canvas = $pad.find('canvas')[0];
        if (!canvas) return;
        var canvasRect = canvas.getBoundingClientRect();

        $stars.each(function (index) {
          if (this.classList.contains('enabled')) return;
          var rect = this.getBoundingClientRect();
          var centerX = rect.left - canvasRect.left + rect.width / 2;
          var centerY = rect.top - canvasRect.top + rect.height / 2;
          var radius = rect.width / 2;
          var dx = x - centerX;
          var dy = y - centerY;
          if (dx * dx + dy * dy <= radius * radius) {
            touchedStars.add(index);
          }
        });
      }

      // Read only the canvas pixels underneath a specific star, not the whole card.
      function revealedFraction(star) {
        var canvas = $pad.find('canvas')[0];
        if (!canvas) return 0;
        var rect = star.getBoundingClientRect();
        var canvasRect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / canvasRect.width;
        var scaleY = canvas.height / canvasRect.height;

        var left = Math.max(0, Math.floor((rect.left - canvasRect.left) * scaleX));
        var top = Math.max(0, Math.floor((rect.top - canvasRect.top) * scaleY));
        var right = Math.min(canvas.width, Math.ceil((rect.right - canvasRect.left) * scaleX));
        var bottom = Math.min(canvas.height, Math.ceil((rect.bottom - canvasRect.top) * scaleY));
        var width = right - left;
        var height = bottom - top;
        if (width < 1 || height < 1) return 0;

        var pixels;
        try {
          pixels = canvas.getContext('2d').getImageData(left, top, width, height);
        } catch (err) {
          // If the browser cannot inspect the canvas, leave this link locked.
          return 0;
        }

        var erased = 0;
        var counted = 0;
        var stride = Math.max(1, Math.floor(Math.min(width, height) / 55));
        for (var row = 0; row < height; row += stride) {
          for (var col = 0; col < width; col += stride) {
            var dx = (col + 0.5) / width - 0.5;
            var dy = (row + 0.5) / height - 0.5;
            if (dx * dx + dy * dy > 0.25) continue;
            counted++;
            var alpha = pixels.data[(row * width + col) * 4 + 3];
            if (alpha < 50) erased++;
          }
        }
        return counted ? erased / counted : 0;
      }

      function unlockScratchedStars() {
        touchedStars.forEach(function (index) {
          var star = $stars[index];
          if (star && revealedFraction(star) >= STAR_REVEAL_FRACTION) {
            star.classList.add('enabled');
            star.removeAttribute('tabindex');
          }
        });
        touchedStars.clear();
      }

      // The scratch plugin appends its own background image and canvas.
      // Add links afterwards so they can receive clicks when unlocked.
      $stars.detach();
      $pad.wScratchPad({
        size: 10,
        bg: 'images/back.png',
        fg: 'images/front.png',
        realtime: true,
        cursor: 'crosshair',
        scratchDown: function (event) {
          touchedStars.clear();
          markTouched(event);
        },
        scratchMove: function (event) {
          markTouched(event);
        },
        scratchUp: function () {
          unlockScratchedStars();
        }
      });
      $pad.append($stars);

      $stars.on('click', function (event) {
        if (!this.classList.contains('enabled')) event.preventDefault();
      });

      $('#tryAgain').on('click', function () {
        touchedStars.clear();
        $stars.removeClass('enabled').attr('tabindex', '-1');
        $pad.wScratchPad('clear');
        $pad.wScratchPad('reset');
      });
    });
  </script>
</body>
</html>
