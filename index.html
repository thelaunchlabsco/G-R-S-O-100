<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gender Reveal Scratch Off</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; padding: 16px 10px 72px; background: #efefef; font-family: Arial, sans-serif; }
    .scratch-container { width: min(450px, 100%); margin: 0 auto; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    .scratchpad { position: relative; width: 100%; aspect-ratio: 9 / 16; height: auto; overflow: hidden; background: #fff; }
    /* Coordinates below are based on the original 1080x1920 back.png. */
    .star-link { position: absolute; z-index: 20; width: 21%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); display: block; pointer-events: none; cursor: pointer; outline-offset: 2px; }
    .star-link.enabled { pointer-events: auto; }
    .star-link:focus-visible { outline: 3px solid #333; }
    .star-1 { left: 24%; top: 64.2%; }
    .star-2 { left: 50%; top: 64.2%; }
    .star-3 { left: 76%; top: 64.2%; }
    .star-4 { left: 24%; top: 79.9%; }
    .star-5 { left: 50%; top: 79.9%; }
    .star-6 { left: 76%; top: 79.9%; }
    .try-again-btn { display: block; margin: 12px auto 0; padding: 10px 20px; background: #ff6b6b; color: white; font-weight: bold; border: 0; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="scratch-container">
    <div id="scratchArea" class="scratchpad">
      <!-- All six links sit exactly over the stars; images themselves are unchanged. -->
      <a class="star-link star-1" href="girl.html" aria-label="It's a Girl — top left"></a>
      <a class="star-link star-2" href="boy.html" aria-label="It's a Boy — top middle"></a>
      <a class="star-link star-3" href="girl.html" aria-label="It's a Girl — top right"></a>
      <a class="star-link star-4" href="boy.html" aria-label="It's a Boy — bottom left"></a>
      <a class="star-link star-5" href="girl.html" aria-label="It's a Girl — bottom middle"></a>
      <a class="star-link star-6" href="boy.html" aria-label="It's a Boy — bottom right"></a>
    </div>
    <button type="button" class="try-again-btn" id="tryAgain">Try Again</button>
  </div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="./wScratchPad.min.js"></script>
  <script>
    $(function () {
      var $area = $('#scratchArea');
      var $links = $area.find('.star-link');
      // Preserve links if scratch plugin replaces the scratchpad's children.
      $links.detach();
      $area.wScratchPad({
        size: 10,
        bg: 'images/back.png',
        fg: 'images/front.png',
        realtime: true,
        cursor: 'crosshair',
        scratchMove: function (event, percent) {
          // Enable the star links after the visitor scratches some of the cover.
          if (percent >= 10) $links.addClass('enabled');
        }
      });
      $area.append($links);
      $('#tryAgain').on('click', function () {
        $links.removeClass('enabled');
        $area.wScratchPad('reset');
      });
    });
  </script>
</body>
</html>
