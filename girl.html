<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>It's a Girl!</title>
<style>
*{box-sizing:border-box}body{background:#fff0f6;margin:0;min-height:100vh;display:grid;place-content:center;padding:10px;font:14px system-ui,Arial,sans-serif;color:#697088}
.stage{position:relative;width:min(95vw,440px);aspect-ratio:9/16;margin:auto;overflow:hidden;box-shadow:0 9px 28px #33446618}
.stage>.template{position:absolute;inset:0;width:100%;height:100%;display:block}
.photo-holder{position:absolute;inset:0;width:100%;height:100%;-webkit-mask-image:url('images/photo-window.svg');mask-image:url('images/photo-window.svg');-webkit-mask-size:100% 100%;mask-size:100% 100%}
.photo-holder img{position:absolute;left:0;top:29.8%;width:100%;height:54%;object-fit:cover;object-position:center;filter:grayscale(100%)}
#warning{text-align:center;max-width:420px;margin:12px auto 0}
</style></head>
<body data-gender="girl">
<main><div class="stage"><img class="template" src="images/girl.png" alt="It's a Girl! customized reveal"><div class="photo-holder"><img id="chosenPhoto" alt="Custom reveal photo" hidden></div></div>
<p id="warning"></p></main>
<script src="reveal.js"></script>
</body></html>
